name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `merge_group` fires when GitHub's merge queue rebases a PR onto the
  # queue head and dispatches CI on the resulting `gh-readonly-queue/...`
  # ref. Including it now means required-status-checks keep working if
  # we enable the merge queue later.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR builds when a new push lands; never cancel `main`
  # or merge-queue refs — the queue depends on each speculative build
  # completing on the exact rebuilt commit it dispatched.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}

# NOTE: the `toolchain` value below is pinned — keep it in sync with
# `rust-toolchain.toml` at the workspace root. Bump both in the same
# commit when we deliberately move forward. dtolnay/rust-toolchain
# honors the file too, but passing the version explicitly keeps the
# invariant visible on every job.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Linux only. deCPLD is a pure data transformation — text in, fuse
  # vector out — with no platform-specific code, no FFI, and no OS
  # interaction beyond reading and writing files. There is nothing a
  # macOS runner would catch that a Linux runner would not, and macOS
  # minutes cost several times more. Add a second OS back only if
  # genuinely `cfg`-gated code ever appears.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      # `--locked` because reproducibility is normative (SPEC.md §13.2):
      # the committed Cargo.lock is part of "the same compiler", and a
      # silent dependency bump in CI would undermine the guarantee that
      # the same inputs produce the same fuse vector.
      - run: cargo test --workspace --locked

  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: markdown no-hardwrap lint
        run: scripts/markdown-no-hardwrap.sh
