[workspace]
resolver = "3"
# Every crate lives under `crates/`. SPEC.md §0.3 names the full target
# layout (syntax, package, hir, types, rtl, logic, device, atf22v10,
# atf16v8, jedec, sim, diagnostics, driver, cli, lsp, oracle); crates
# are added as the milestones that need them land, not up front as
# empty stubs.
members = ["crates/*"]

# Shared package metadata. Individual crates inherit with `field.workspace = true`.
[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/enthal/decpld"
rust-version = "1.95"
authors = ["Timothy James"]

# Lints applied to every workspace crate via `[lints] workspace = true`.
#
# `unsafe_code = "forbid"` is set here rather than as a `#![forbid(...)]`
# in each crate root so it cannot be forgotten when a crate is added —
# the same "make wrong states unrepresentable" reflex the compiler
# itself is built on. deCPLD is a pure data-transformation pipeline
# (text → IR → fuse vector); there is no FFI or hardware access in it,
# so there is no legitimate reason for `unsafe` anywhere in the tree.
[workspace.lints.rust]
unsafe_code = "forbid"

# Every dependency — internal or third-party — is declared here once and
# inherited with `dep.workspace = true`, so the workspace can only ever
# agree on one version.
[workspace.dependencies]
decpld-diagnostics = { path = "crates/decpld-diagnostics" }
decpld-jedec = { path = "crates/decpld-jedec" }
decpld-device = { path = "crates/decpld-device" }
decpld-atf22v10 = { path = "crates/decpld-atf22v10" }

# Derived error types. Keeps the "errors identify object context" rule
# (CLAUDE.md) cheap enough that there is no excuse for a bare String.
thiserror = "2"

# Command-line parsing for the `decpld` binary. Matches the sibling
# enthal projects; SPEC.md §8 specifies a nested subcommand tree
# that is not worth hand-rolling.
clap = { version = "4", features = ["derive"] }

# Property testing. The round-trip invariants in decpld-jedec are the
# kind of claim that example tests can only sample and properties can
# actually state.
proptest = "1"
