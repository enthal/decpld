# Primary references for deCPLD device and format knowledge.
#
# SPEC.md §5.33 requires that exact revisions and hashes live here. The
# `sha256` IS the identity of a document: vendors reissue PDFs at the
# same URL without changing any visible revision string, so a citation
# that names only a title and a URL cannot be checked later. A citation
# that names a hash can.
#
# The documents themselves are NOT committed. They are third-party and
# in some cases proprietary; `.gitignore` excludes them from this
# directory. Re-fetch and check them with:
#
#     targets/evidence/verify-references.sh
#
# Source comments in target definitions cite a reference by its `id`
# plus a locator, e.g.:
#
#     // Evidence: atf22v10c-datasheet §"Logic Diagram", macrocell 0 row range.
#     // Level: DifferentiallyVerified (targets/fixtures/atf22v10/oe-baseline).

schema_version = 1

[[reference]]
id = "jedec-3a"
title = "JEDEC Standard No. 3A — Data Transfer Format"
publisher = "JEDEC / Data I/O (historical text, Data I/O-specific implementation)"
url = "https://k1.spdns.de/Develop/Projects/GalAsm/info/JEDEC%20File%20Standard%203A.txt"
media_type = "text/plain"
sha256 = "9207f92b8a23453998cf8b9d89751e6c61aa1bf74df2680510a2364e7e6403af"
bytes = 28332
retrieved = "2026-08-04"
revision = "3A"
authoritative_for = [
  "STX/ETX transmission framing",
  "field syntax: <field identifier> (lines 219-221) and <reserved identifier> (lines 223-225)",
  "the <field character> class (lines 158-160)",
  "Q subfields QF/QP/QV and the value-field ordering rule (lines 305-325)",
  "transmission checksum algorithm",
  "fuse checksum algorithm and 8-bit word packing",
  "L-field override semantics for patched files",
  "F-field cardinality and its position before the fuse lists (lines 357-377)",
]
notes = """
Contains worked numeric examples for both checksums. Those examples are \
reproduced verbatim as golden tests in decpld-jedec, which is why the \
algorithms did not have to be taken on trust from any implementation.

Known erratum: the text says both checksums are computed "modulo 65,535". \
The worked examples are consistent with ordinary 16-bit wraparound \
(modulo 65,536), and every extant implementation uses 65,536. deCPLD \
implements 65,536 and records the discrepancy at the call site.

Transcription defects in THIS copy — the prose is reliable, some examples \
are not:

1. The opening PLD 12S8 example prints L fields with no separator between \
   the fuse number and the fuse states ("L001111101111..."), contradicting \
   the body text at line 385, which requires a space or carriage return. \
   deCPLD follows the body text and rejects unseparated L fields, because \
   fuse states are 0 and 1 — also digits — so the field is genuinely \
   ambiguous rather than merely unusual.

2. The three "equivalent" fuse-list forms in the Fuse List Field section \
   are not equivalent as printed: measured state counts are 108, 107, and \
   four 27-state blocks placed on a 28-fuse stride. Characters have been \
   lost somewhere in the document's history. These examples are therefore \
   NOT used as golden tests; the checksum examples, which are internally \
   consistent and verified arithmetically, are.

3. The two identifier tables disagree about R, S and T. The summary table \
   at line 74 calls them collectively "Signature analysis"; the detailed \
   table at lines 243-245 gives R = Resulting vector, S = Starting vector, \
   T = Test cycles. This does not affect deCPLD, which needs only the fact \
   that all three are defined identifiers, and both tables agree on that. \
   Recorded because this copy's examples are already known unreliable and \
   a future reader should not have to rediscover it.

Identifier tables transcribed from the BNF (the normative statement) \
rather than the prose table, and checked by a property no partial \
transcription can satisfy: the 14 defined and 12 reserved identifiers are \
disjoint and cover A-Z exactly. An earlier transcription omitted T and Q \
and had no notion of "reserved" at all; the partition check is what makes \
that class of error impossible to reintroduce silently.\
"""

